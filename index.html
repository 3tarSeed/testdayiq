<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Free mobile-friendly ACT and SAT cheat sheet with formulas, grammar rules, reading strategies, ACT Science tactics, flashcards, and a test-day checklist." />
  <meta name="theme-color" content="#0f172a" />
  <title>ACT &amp; SAT Pocket Cheat Sheet — Study Anywhere</title>

  <!-- Google AdSense (replace ca-pub-XXXXXXXXXXXXXXXX with your publisher ID before going live) -->
  <!--
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --soft: #e2e8f0;
      --line: #dbe3ee;
      --navy: #111827;
      --blue: #2563eb;
      --cyan: #0891b2;
      --green: #059669;
      --orange: #ea580c;
      --rose: #e11d48;
      --violet: #7c3aed;
      --amber: #d97706;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --radius: 22px;
      --shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .phone-shell {
      width: min(100%, 460px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 110px;
      background: var(--bg);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 14px 12px;
      background: rgba(246, 248, 251, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(219, 227, 238, 0.8);
    }

    .hero {
      border-radius: 28px;
      padding: 18px;
      color: white;
      background: radial-gradient(120% 100% at 0% 0%, #1e3a8a 0%, #111827 55%, #020617 100%);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: -40% -10% auto auto;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(96,165,250,0.35), transparent 60%);
      pointer-events: none;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 24px;
    }

    .eyebrow {
      margin: 0;
      color: #93c5fd;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 2px 0 0;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 26px;
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .hero-copy {
      margin: 14px 0 0;
      color: #dbeafe;
      font-size: 14px;
      line-height: 1.45;
      position: relative;
      z-index: 1;
    }

    .switch-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .exam-btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 800;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease;
    }

    .exam-btn:active { transform: scale(0.97); }

    .exam-btn.active {
      color: #0f172a;
      background: white;
    }

    .search-wrap {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 18px;
      padding: 10px 12px;
      background: white;
      border: 1px solid var(--line);
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.03);
    }

    .search-wrap span { color: var(--muted); }
    .search-wrap input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-weight: 700;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: white;
      color: #475569;
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .tab-btn.active {
      border-color: #111827;
      background: #111827;
      color: white;
    }

    main { padding: 14px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 12px;
    }

    .selected-card {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    .label {
      margin: 0 0 4px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--muted);
    }

    .title {
      margin: 0;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .subtext {
      margin: 5px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .big-icon {
      flex: 0 0 auto;
      width: 54px;
      height: 54px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-size: 26px;
    }

    .timing {
      background: #101827;
      border-color: #101827;
      color: white;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .timing-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      margin-top: 8px;
    }

    .timing-row strong { display: block; font-size: 14px; }
    .timing-row small { display: block; color: #cbd5e1; margin-top: 2px; line-height: 1.3; }

    .pace {
      padding: 6px 9px;
      border-radius: 999px;
      background: #bae6fd;
      color: #082f49;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
      font-family: var(--mono);
    }

    .note {
      margin-top: 10px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: #dbeafe;
      font-size: 12px;
      line-height: 1.45;
    }

    .rule-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 20px;
    }

    .amber { background: #fffbeb; color: var(--amber); }
    .blue { background: #eff6ff; color: var(--blue); }
    .green { background: #ecfdf5; color: var(--green); }
    .orange { background: #fff7ed; color: var(--orange); }
    .cyan { background: #ecfeff; color: var(--cyan); }
    .violet { background: #f5f3ff; color: var(--violet); }
    .rose { background: #fff1f2; color: var(--rose); }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 800;
      background: #f1f5f9;
      color: #475569;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .section-card .head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .bullet {
      display: flex;
      gap: 8px;
      color: #334155;
      line-height: 1.42;
      font-size: 14px;
      margin: 9px 0;
    }

    .bullet .check { color: var(--green); font-weight: 900; flex-shrink: 0; }

    .trap-box {
      margin-top: 14px;
      border-radius: 18px;
      background: #fff1f2;
      padding: 12px;
    }

    .trap-title {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 900;
      color: var(--rose);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .trap-chip {
      border-radius: 999px;
      background: white;
      color: #be123c;
      border: 1px solid #ffe4e6;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .formula-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }

    .formula {
      margin: 10px 0 4px;
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .steps {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border-radius: 16px;
      background: #f8fafc;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .num {
      flex: 0 0 auto;
      width: 25px;
      height: 25px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-size: 12px;
      font-weight: 900;
    }

    .example {
      margin: 12px 0 0;
      border-radius: 16px;
      background: #ecfeff;
      color: #164e63;
      padding: 12px;
      font-size: 13px;
      line-height: 1.45;
    }

    .grammar-card {
      padding: 14px;
    }

    .grammar-rule {
      margin: 10px 0 0;
      padding: 12px;
      background: #f8fafc;
      border-radius: 16px;
      border-left: 4px solid var(--violet);
    }

    .grammar-rule strong {
      display: block;
      font-size: 14px;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .grammar-rule .ex {
      display: block;
      margin-top: 6px;
      font-size: 12.5px;
      color: #475569;
      line-height: 1.45;
      font-style: italic;
    }

    .grammar-rule .ex b { color: var(--green); font-style: normal; }
    .grammar-rule .ex s { color: var(--rose); font-style: normal; text-decoration-thickness: 2px; }

    .flash-card-button {
      width: 100%;
      min-height: 180px;
      border: 1px solid #ddd6fe;
      border-radius: 24px;
      text-align: left;
      padding: 22px;
      background: linear-gradient(165deg, #ffffff 0%, #faf5ff 100%);
      color: var(--ink);
      box-shadow: 0 5px 16px rgba(124, 58, 237, 0.08);
      transition: transform 0.12s ease;
    }

    .flash-card-button:active { transform: scale(0.99); }

    .flash-prompt {
      margin: 10px 0 8px;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.18;
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    .two-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .three-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .action-btn {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: white;
      color: #334155;
      font-weight: 800;
      font-size: 13px;
    }

    .action-btn.dark {
      border-color: #111827;
      background: #111827;
      color: white;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      border-radius: 16px;
      background: #f8fafc;
      color: #334155;
      padding: 12px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 700;
      margin-top: 8px;
      line-height: 1.35;
    }

    .check-circle {
      flex: 0 0 auto;
      width: 25px;
      height: 25px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: white;
      color: #cbd5e1;
      font-weight: 900;
    }

    .check-item.done {
      background: #ecfdf5;
      color: #065f46;
    }

    .check-item.done .check-circle {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    .empty {
      padding: 24px 14px;
      text-align: center;
      color: var(--muted);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 12px;
      z-index: 25;
      transform: translateX(-50%);
      width: min(calc(100% - 24px), 436px);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
    }

    .bottom-nav button {
      border: 0;
      border-radius: 17px;
      background: transparent;
      color: #64748b;
      padding: 8px 2px;
      font-size: 9.5px;
      font-weight: 800;
      display: grid;
      gap: 2px;
      place-items: center;
      letter-spacing: 0.02em;
    }

    .bottom-nav button span { font-size: 17px; line-height: 1; }
    .bottom-nav button.active {
      color: #111827;
      background: #f1f5f9;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .quick-tile {
      border-radius: 18px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .quick-tile strong { display: block; font-size: 13px; }
    .quick-tile span { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); line-height: 1.35; }

    .score-tile {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 14px;
      background: #f8fafc;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
    }

    .score-tile b { font-family: var(--mono); font-size: 13px; color: var(--blue); }

    .group-tag {
      display: inline-block;
      background: #ecfdf5;
      color: #047857;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* AdSense slot styling */
    .ad-slot {
      display: block;
      width: 100%;
      min-height: 100px;
      margin: 14px 0;
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: #fafbfd;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .footer {
      padding: 18px 14px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .footer a { color: var(--blue); text-decoration: none; }

    @media (min-width: 720px) {
      .phone-shell { max-width: 880px; padding-bottom: 30px; }
      main { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 14px; align-items: start; }
      .desktop-span { grid-column: 1 / -1; }
      .bottom-nav { display: none; }
      .tabs { padding-bottom: 0; }
      h1 { font-size: 30px; }
    }

    @media print {
      .topbar, .bottom-nav, .search-wrap, .tabs, .ad-slot { display: none !important; }
      body, .phone-shell { background: white; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <header class="topbar">
      <section class="hero">
        <div class="brand-row">
          <div class="logo" id="heroIcon">🎯</div>
          <div>
            <p class="eyebrow">Pocket Prep</p>
            <h1>ACT &amp; SAT Cheat Sheet</h1>
          </div>
        </div>
        <p class="hero-copy" id="heroCopy"></p>
        <div class="switch-row" role="tablist" aria-label="Choose exam">
          <button class="exam-btn" data-exam="ACT" aria-label="Switch to ACT content">ACT</button>
          <button class="exam-btn" data-exam="SAT" aria-label="Switch to SAT content">SAT</button>
        </div>
      </section>

      <div class="search-wrap">
        <span aria-hidden="true">🔎</span>
        <input id="searchInput" type="search" placeholder="Search grammar, slope, science, pacing..." autocomplete="off" aria-label="Search the cheat sheet" />
      </div>

      <nav class="tabs" id="topTabs" role="tablist"></nav>
    </header>

    <main id="app"></main>

    <footer class="footer">
      <p>Built for studying — content reflects the digital SAT and Enhanced ACT formats. Always verify rules at <a href="https://satsuite.collegeboard.org/" rel="noopener">SAT Suite</a> or <a href="https://www.act.org/" rel="noopener">ACT.org</a>.</p>
    </footer>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Section navigation"></nav>

  <script>
    /* ============================================================
       EXAM METADATA — current as of the digital SAT and Enhanced ACT
       ============================================================ */
    const exams = {
      ACT: {
        name: "ACT (Enhanced)",
        subtitle: "English, Math, Reading + optional Science & Writing",
        hero: "Master pacing, grammar patterns, fast math, reading triage, and science data skills.",
        icon: "🧪",
        note: "Enhanced ACT (April 2025+): Science is optional and Math has 4 answer choices instead of 5. Composite (1–36) is the average of English, Math, and Reading only.",
        timing: [
          { section: "English", time: "35 min", questions: "50 Q (40 scored)", scored: "Grammar, rhetoric, organization", pace: "~42 sec/Q" },
          { section: "Math", time: "50 min", questions: "45 Q (41 scored)", scored: "Pre-algebra → trig, 4 choices", pace: "~1:07/Q" },
          { section: "Reading", time: "40 min", questions: "36 Q (27 scored)", scored: "4 passages, ~9 Q each", pace: "~1:07/Q" },
          { section: "Science", time: "40 min", questions: "40 Q (34 scored)", scored: "Optional — graphs, data, experiments", pace: "~1:00/Q", optional: true },
          { section: "Writing", time: "40 min", questions: "1 essay", scored: "Optional — scored 2–12", pace: "Plan → write → check", optional: true },
        ],
        scoring: [
          { name: "Composite", range: "1–36", how: "Average of English, Math, Reading (rounded)" },
          { name: "Section scores", range: "1–36 each", how: "Reported separately for each subject" },
          { name: "Science / Writing", range: "1–36 / 2–12", how: "Reported separately, not in composite" },
          { name: "STEM / ELA", range: "1–36", how: "Reporting categories that combine subjects" },
        ],
      },
      SAT: {
        name: "Digital SAT",
        subtitle: "Reading & Writing + Math, fully digital and adaptive",
        hero: "Win short questions, evidence, grammar, algebra, and Desmos strategy.",
        icon: "📘",
        note: "Digital SAT: Each section has 2 modules. Module 2 difficulty adapts based on Module 1 performance. A built-in Desmos calculator and reference sheet are available the entire Math section.",
        timing: [
          { section: "Reading & Writing", time: "64 min total", questions: "54 Q", scored: "2 modules × 32 min, 27 Q each", pace: "~1:11/Q" },
          { section: "Math", time: "70 min total", questions: "44 Q", scored: "2 modules × 35 min, 22 Q each", pace: "~1:35/Q" },
        ],
        scoring: [
          { name: "Total score", range: "400–1600", how: "Sum of section scores" },
          { name: "Reading & Writing", range: "200–800", how: "Adaptive across two modules" },
          { name: "Math", range: "200–800", how: "Adaptive across two modules" },
          { name: "No guessing penalty", range: "0", how: "Always answer every question" },
        ],
      },
    };

    /* ============================================================
       QUICK RULES — universal high-leverage moves
       ============================================================ */
    const quickRules = [
      { exam: "Both", icon: "🎯", title: "Collect points fast", body: "You don't need every question. Skip traps, lock in easy points, and circle back if time allows.", tag: "Core Rule" },
      { exam: "Both", icon: "⏱️", title: "The 20-second rule", body: "If you have no path after 20 seconds, mark it, guess your favorite letter, and move. Staring earns zero points.", tag: "Pacing" },

      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function searchableText(obj) { return JSON.stringify(obj).toLowerCase(); }

    function setExam(exam) {
      state.exam = exam;
      // Science tab is ACT-only; Grammar/Reading apply to both
      if (exam === "SAT" && state.tab === "Science") state.tab = "Cheat Sheet";
      state.query = "";
      searchInput.value = "";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setTab(tab) {
      state.tab = tab;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function filtered(items) {
      const q = state.query.trim().toLowerCase();
      if (!q) return items;
      return items.filter(item => searchableText(item).includes(q));
    }

    function adSlot(label = "Advertisement") {
      // Replace this block with your live AdSense unit when approved.
      return `
        <div class="ad-slot desktop-span" aria-label="Advertisement placeholder" data-ad-slot>
          ${escapeHtml(label)}
          <!--
          <ins class="adsbygoogle"
               style="display:block"
               data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
               data-ad-slot="XXXXXXXXXX"
               data-ad-format="auto"
               data-full-width-responsive="true"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
          -->
        </div>`;
    }

    function renderHeader() {
      const data = exams[state.exam];
      document.getElementById("heroCopy").textContent = data.hero;
      document.getElementById("heroIcon").textContent = data.icon;
      document.querySelectorAll(".exam-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.exam === state.exam));

      const visibleTabs = tabs.filter(t => state.exam === "ACT" || t.id !== "Science");
      topTabs.innerHTML = visibleTabs.map(t => `<button class="tab-btn ${state.tab === t.id ? "active" : ""}" data-tab="${t.id}">${t.id}</button>`).join("");
      bottomNav.innerHTML = visibleTabs.map(t => `<button class="${state.tab === t.id ? "active" : ""}" data-tab="${t.id}" aria-label="${t.id}"><span aria-hidden="true">${t.icon}</span>${t.short}</button>`).join("");
    }

    function selectedExamCard() {
      const data = exams[state.exam];
      return `
        <section class="card selected-card desktop-span">
          <div>
            <p class="label">Selected Exam</p>
            <h2 class="title">${escapeHtml(data.name)}</h2>
            <p class="subtext">${escapeHtml(data.subtitle)}</p>
          </div>
          <div class="big-icon">${data.icon}</div>
        </section>`;
    }

    function timingCard() {
      const data = exams[state.exam];
      return `
        <section class="card timing">
          <div class="section-heading">⏱️ <span>Timing Snapshot</span></div>
          ${data.timing.map(row => `
            <div class="timing-row">
              <div>
                <strong>${escapeHtml(row.section)}${row.optional ? " <span class='pill'>Optional</span>" : ""}</strong>
                <small>${escapeHtml(row.questions)} • ${escapeHtml(row.time)} • ${escapeHtml(row.scored)}</small>
              </div>
              <div class="pace">${escapeHtml(row.pace)}</div>
            </div>`).join("")}
          <div class="note">${escapeHtml(data.note)}</div>
        </section>`;
    }

    function scoringCard() {
      const data = exams[state.exam];
      return `
        <section class="card">
          <div class="section-heading">🏁 <span>How It's Scored</span></div>
          ${data.scoring.map(s => `
            <div class="score-tile">
              <span class="pill">${escapeHtml(s.range)}</span>
              <span><strong>${escapeHtml(s.name)}</strong><br><span style="color:var(--muted);font-size:12px;">${escapeHtml(s.how)}</span></span>
            </div>`).join("")}
        </section>`;
    }

    function rulesCard() {
      const rules = filtered(quickRules.filter(r => r.exam === state.exam || r.exam === "Both"));
      if (!rules.length) return `<section class="card empty">No matching quick rules.</section>`;
      return rules.map(rule => `
        <section class="card rule-card">
          <div class="icon-box amber">${rule.icon}</div>
          <div>
            <div style="display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:4px;">
              <h3 class="title" style="font-size:16px;">${escapeHtml(rule.title)}</h3>
              <span class="pill">${escapeHtml(rule.tag)}</span>
            </div>
            <p class="subtext">${escapeHtml(rule.body)}</p>
          </div>
        </section>`).join("");
    }

    function sectionCard(section) {
      return `
        <section class="card section-card">
          <div class="head">
            <div class="icon-box ${section.tone}">${section.icon}</div>
            <div>
              <h3 class="title" style="font-size:18px;">${escapeHtml(section.name)}</h3>
              <p class="subtext">High-yield moves and common traps.</p>
            </div>
          </div>
          ${section.bullets.map(b => `<div class="bullet"><span class="check">✓</span><span>${escapeHtml(b)}</span></div>`).join("")}
          <div class="trap-box">
            <p class="trap-title">Common Traps</p>
            <div class="chips">${section.traps.map(t => `<span class="trap-chip">${escapeHtml(t)}</span>`).join("")}</div>
          </div>
        </section>`;
    }

    function cheatSheetView() {
      const activeSections = filtered(sections.filter(s => s.exam === state.exam));
      return `
        ${selectedExamCard()}
        ${timingCard()}
        ${scoringCard()}
        ${adSlot("Sponsored")}
        <div>${rulesCard()}</div>
        <div>${activeSections.length ? activeSections.map(sectionCard).join("") : `<section class="card empty">No matching sections.</section>`}</div>
        ${adSlot("Sponsored")}
      `;
    }

    function formulasView() {
      const items = filtered(formulas);
      const grouped = items.reduce((acc, f) => {
        (acc[f.group] = acc[f.group] || []).push(f);
        return acc;
      }, {});
      return `
        ${selectedExamCard()}
        <section class="card desktop-span">
          <p class="label">Math Formula Bank</p>
          <h2 class="title">Memorize these — they show up everywhere</h2>
          <p class="subtext">${state.exam === "SAT" ? "SAT provides a basic reference sheet, but knowing these from memory is faster." : "ACT provides NO formulas. Memorization is mandatory."}</p>
        </section>
        ${Object.keys(grouped).length ? Object.entries(grouped).map(([group, list]) => `
          <section class="card desktop-span">
            <span class="group-tag">${escapeHtml(group)}</span>
            ${list.map(f => `
              <div style="margin-top:10px;padding:10px;background:#f8fafc;border-radius:14px;">
                <p class="formula">${escapeHtml(f.formula)}</p>
                <p class="subtext">${escapeHtml(f.why)}</p>
              </div>`).join("")}
          </section>`).join("") : `<section class="card empty">No matching formulas.</section>`}
        ${adSlot("Sponsored")}
      `;
    }

    function grammarView() {
      const items = filtered(grammar);
      const grouped = items.reduce((acc, g) => {
        (acc[g.group] = acc[g.group] || []).push(g);
        return acc;
      }, {});
      return `
        ${selectedExamCard()}
        <section class="card desktop-span">
          <p class="label">Grammar Rules</p>
          <h2 class="title">${state.exam === "ACT" ? "ACT English & Writing" : "SAT Writing"} essentials</h2>
          <p class="subtext">These rules cover the majority of grammar questions on both exams. Look for these patterns first.</p>
        </section>
        ${Object.keys(grouped).length ? Object.entries(grouped).map(([group, list]) => `
          <section class="card grammar-card desktop-span">
            <span class="group-tag" style="background:#f5f3ff;color:#6d28d9;">${escapeHtml(group)}</span>
            ${list.map(rule => `
              <div class="grammar-rule">
                <strong>${escapeHtml(rule.title)}</strong>
                ${escapeHtml(rule.body)}
                <span class="ex"><b>✓ ${escapeHtml(rule.good)}</b></span>
                <span class="ex"><s>✗ ${escapeHtml(rule.bad)}</s></span>
              </div>`).join("")}
          </section>`).join("") : `<section class="card empty">No matching grammar rules.</section>`}
        ${adSlot("Sponsored")}
      `;
    }

    function readingView() {
      const items = filtered(readingStrategies.filter(r => r.exam === "Both" || r.exam === state.exam));
      return `
        ${selectedExamCard()}
        <section class="card desktop-span" style="background:#fff7ed;border-color:#fed7aa;">
          <div class="section-heading">📖 <span>Reading Game Plan</span></div>
          <p style="margin:0;color:#7c2d12;font-size:14px;line-height:1.5;">Don't memorize the passage. Skim once for structure, then let the questions drive your re-reading. Right answers are paraphrases of the text — wrong answers twist, exaggerate, or invent.</p>
        </section>
        ${items.length ? items.map(strategy => `
          <section class="card">
            <div style="display:flex;gap:7px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
              <span class="pill" style="background:#fff7ed;color:#c2410c;">${escapeHtml(strategy.exam === "Both" ? "Both" : strategy.exam)}</span>
              <h3 class="title" style="font-size:17px;">${escapeHtml(strategy.title)}</h3>
            </div>
            <p class="subtext" style="font-size:13.5px;color:#334155;">${escapeHtml(strategy.how)}</p>
          </section>`).join("") : `<section class="card empty">No matching reading strategies.</section>`}
        ${adSlot("Sponsored")}
      `;
    }

    function scienceView() {
      if (state.exam !== "ACT") return cheatSheetView();
      const items = filtered(scienceToolkit);
      return `
        ${selectedExamCard()}
        <section class="card" style="background:#164e63;color:white;border-color:#164e63;">
          <div class="section-heading">🧪 <span>ACT Science Survival Rule</span></div>
          <p style="margin:0;color:#cffafe;font-size:14px;line-height:1.5;">Treat Science as a data-reading section. Most answers are in graphs, tables, labels, units, and trends — not in the prose.</p>
          <div class="note" style="background:rgba(255,255,255,.12);color:#ecfeff;font-weight:700;">Order: question → visual/table → units → trend → answer.</div>
        </section>
        ${items.length ? items.map(item => `
          <section class="card">
            <div class="section-heading" style="margin-bottom:4px;">🧪 <span>${escapeHtml(item.title)}</span></div>
            <div class="steps">
              ${item.steps.map((s, i) => `<div class="step"><span class="num">${i + 1}</span><span>${escapeHtml(s)}</span></div>`).join("")}
            </div>
            <p class="example">${escapeHtml(item.example)}</p>
          </section>`).join("") : `<section class="card empty">No matching Science tools.</section>`}
        ${adSlot("Sponsored")}
      `;
    }

    function flashcardsView() {
      const card = flashcards[state.flashIndex];
      return `
        ${selectedExamCard()}
        <section class="card desktop-span" style="background:linear-gradient(160deg,#faf5ff 0%,#ffffff 100%);">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;">
            <div class="section-heading" style="margin:0;">✨ <span>Flashcard Drill</span></div>
            <span class="pill">${state.flashIndex + 1}/${flashcards.length}</span>
          </div>
          <button class="flash-card-button" data-action="flip" aria-label="Flip flashcard">
            <p class="label" style="color:#7c3aed;">${state.showAnswer ? "Answer" : "Question"}</p>
            <p class="flash-prompt">${escapeHtml(state.showAnswer ? card.a : card.q)}</p>
            <p class="subtext" style="font-weight:700;">Tap card to ${state.showAnswer ? "hide answer" : "reveal answer"}</p>
          </button>
          <div class="three-buttons">
            <button class="action-btn" data-action="prevCard" aria-label="Previous card">← Back</button>
            <button class="action-btn" data-action="shuffle" aria-label="Shuffle cards">🔀 Shuffle</button>
            <button class="action-btn dark" data-action="nextCard" aria-label="Next card">Next →</button>
          </div>
        </section>
        ${adSlot("Sponsored")}
      `;
    }

    function checklistView() {
      const doneCount = Object.values(state.done).filter(Boolean).length;
      return `
        ${selectedExamCard()}
        <section class="card desktop-span">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">
            <div class="section-heading" style="margin:0;">✅ <span>Test-Day Checklist</span></div>
            <span class="pill" style="background:#ecfdf5;color:#047857;">${doneCount}/${checklist.length}</span>
          </div>
          ${checklist.map((item, i) => `
            <button class="check-item ${state.done[i] ? "done" : ""}" data-check="${i}">
              <span class="check-circle">✓</span>
              <span>${escapeHtml(item)}</span>
            </button>`).join("")}
        </section>

        <section class="card desktop-span" style="background:#fffbeb;border-color:#fde68a;">
          <div class="section-heading">⚡ <span>Last 5-Minute Reset</span></div>
          <div class="quick-grid">
            <div class="quick-tile"><strong>Breathe</strong><span>Box breathing — 4 in, 4 hold, 4 out, 4 hold.</span></div>
            <div class="quick-tile"><strong>Next question</strong><span>Focus only on the next point in front of you.</span></div>
            <div class="quick-tile"><strong>Easy first</strong><span>Hard questions don't deserve unlimited time.</span></div>
            <div class="quick-tile"><strong>Read exactly</strong><span>Answer what's asked, not what you expected.</span></div>
            <div class="quick-tile"><strong>Bubble carefully</strong><span>Check question number every 5 questions.</span></div>
            <div class="quick-tile"><strong>Trust prep</strong><span>You've practiced. Run your routine.</span></div>
          </div>
        </section>

        <section class="card desktop-span" style="background:#eff6ff;border-color:#bfdbfe;">
          <div class="section-heading">📅 <span>Week-Of Plan</span></div>
          <div class="bullet"><span class="check">✓</span><span><b>1 week out:</b> Take one full-length practice test under real timing.</span></div>
          <div class="bullet"><span class="check">✓</span><span><b>3 days out:</b> Review your formula sheet and grammar rules. Light practice only.</span></div>
          <div class="bullet"><span class="check">✓</span><span><b>1 day out:</b> Pack everything tonight. Light review. Sleep early.</span></div>
          <div class="bullet"><span class="check">✓</span><span><b>Test morning:</b> Real breakfast, leave early, arrive calm.</span></div>
        </section>
        ${adSlot("Sponsored")}
      `;
    }

    function render() {
      renderHeader();
      const views = {
        "Cheat Sheet": cheatSheetView,
        "Formulas": formulasView,
        "Grammar": grammarView,
        "Reading": readingView,
        "Science": scienceView,
        "Flashcards": flashcardsView,
        "Test Day": checklistView,
      };
      app.innerHTML = views[state.tab]();
    }

    document.addEventListener("click", (event) => {
      const examBtn = event.target.closest("[data-exam]");
      if (examBtn) return setExam(examBtn.dataset.exam);

      const tabBtn = event.target.closest("[data-tab]");
      if (tabBtn) return setTab(tabBtn.dataset.tab);

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "flip") state.showAnswer = !state.showAnswer;
      if (action === "nextCard") { state.flashIndex = (state.flashIndex + 1) % flashcards.length; state.showAnswer = false; }
      if (action === "prevCard") { state.flashIndex = (state.flashIndex - 1 + flashcards.length) % flashcards.length; state.showAnswer = false; }
      if (action === "shuffle") {
        for (let i = flashcards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        state.flashIndex = 0;
        state.showAnswer = false;
      }
      if (action) return render();

      const checkBtn = event.target.closest("[data-check]");
      if (checkBtn) {
        const key = checkBtn.dataset.check;
        state.done[key] = !state.done[key];
        localStorage.setItem("prepChecklist_v2", JSON.stringify(state.done));
        render();
      }
    });

    searchInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
